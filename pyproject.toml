[project]
name = "localrag"
version = "0.1.0"
description = "Private, offline-capable Q&A over documents, with citations. Arabic and English."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
